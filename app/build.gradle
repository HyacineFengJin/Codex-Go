plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
def selectedAbi = project.findProperty('runtimeAbi') ?: (project.hasProperty('uiSmoke') ? 'x86_64' : 'arm64-v8a')
if (!(selectedAbi in ['arm64-v8a', 'x86_64'])) throw new GradleException('runtimeAbi must be arm64-v8a or x86_64')
def runtimeBundle = rootProject.file(".gradle/runtime-bundles/${selectedAbi}")
android {
    namespace 'dev.codex.go'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.codex.go'
        minSdk 30
        targetSdk 35
        versionCode 27
        versionName '0.21.0'
        buildConfigField 'boolean', 'UI_SMOKE', project.hasProperty('uiSmoke') ? 'true' : 'false'
        buildConfigField 'String', 'RUNTIME_ABI', '"' + selectedAbi + '"'
        ndk { abiFilters.add(selectedAbi) }
    }
    sourceSets { main {
        assets.srcDirs = project.hasProperty('uiSmoke') ? ['src/main/assets'] : ['src/main/assets', new File(runtimeBundle, 'assets')]
        jniLibs.srcDirs = project.hasProperty('uiSmoke') ? [] : [new File(runtimeBundle, 'jniLibs')]
        if (project.hasProperty('antigravity')) {
            assets.srcDirs += rootProject.file(".gradle/antigravity-runtime/${selectedAbi}/assets")
            jniLibs.srcDirs += rootProject.file(".gradle/antigravity-runtime/${selectedAbi}/jniLibs")
        }
    } }
    buildFeatures { compose true; buildConfig true; aidl true }
    bundle { language { enableSplit = false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packaging {
        jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] }
        resources { excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/versions/**', 'META-INF/DEPENDENCIES'] }
    }
}
configurations.configureEach { exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18' }
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80.2'
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha12'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}

if (!project.hasProperty('uiSmoke')) {
    def validateRuntime = tasks.register('validateRuntimeBundle') {
        doLast {
            def manifestFile = new File(runtimeBundle, 'assets/runtime/manifest.json')
            if (!manifestFile.exists()) throw new GradleException("Run python tools/prepare_runtime.py --abi ${selectedAbi} before packaging")
            def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
            if (manifest.abi != selectedAbi) throw new GradleException('Runtime bundle ABI mismatch')
            ['rootfs.zip', 'ca.pem'].each { file ->
                if (!new File(runtimeBundle, 'assets/runtime/' + file).isFile()) throw new GradleException('Runtime asset missing: ' + file)
            }
            ['libproot.so', 'libloader.so'].each { file ->
                if (!new File(runtimeBundle, "jniLibs/${selectedAbi}/" + file).isFile()) throw new GradleException('Runtime executable missing: ' + file)
            }
        }
    }
    tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach { dependsOn validateRuntime }
}
